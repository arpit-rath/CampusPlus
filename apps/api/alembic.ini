[alembic]
# Path to migration scripts, relative to this file (run alembic from apps/api/).
script_location = app/db/migrations

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# Timezone for the `created_date` field in new revision files.
timezone = UTC

# Make `app.*` importable from env.py when alembic is invoked from apps/api/.
prepend_sys_path = .

# Version path separator.
version_path_separator = os

# `sqlalchemy.url` is intentionally left blank — env.py overrides it at
# runtime from app.config.get_settings().database_url (single source of
# truth for the connection string, per CLAUDE.md's config convention).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
